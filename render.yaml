services:
  - type: web
    name: mis-finanzas-back
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false   # opcional: URL de mis_finanzas_web para restringir CORS a solo esa web
